# MySQL de développement OMAYI.
#
# Seule la base de données tourne dans Docker. Le client et le serveur se
# lancent sur la machine avec `npm run dev` (ports 3000 et 3310).
#
# Le port MySQL est publié sur 127.0.0.1 uniquement : la base reste
# injoignable depuis le réseau local, même sur un wifi partagé.
#
# Aucun identifiant n'est écrit dans ce fichier : ils sont lus dans le .env
# de la racine, qui n'est pas versionné (voir .env.sample).

name: omayi

services:
  database:
    image: mysql:8.0
    container_name: omayi-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME manquant dans le .env de la racine}
      MYSQL_USER: ${DB_USER:?DB_USER manquant dans le .env de la racine}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans le .env de la racine}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans le .env de la racine}
    ports:
      # host:container - l'adresse 127.0.0.1 limite l'accès à cette machine
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - omayi-database-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  omayi-database-data:
